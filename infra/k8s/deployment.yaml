# One replica on purpose: surveys live in the server's memory (docs/containers.md), so a second replica
# would not see the first one's surveys. Recreate keeps the single-writer volume and the one survey store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: depth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: depth
          image: depth
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: depth-config
            - secretRef:
                name: depth-secrets
                optional: true
          resources:
            requests:
              cpu: "1"
              memory: 768Mi             # measured: ~340 MiB after a survey of the real recording
            limits:
              memory: 2Gi
          startupProbe:                 # the detector loads and warms before the pod takes traffic
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: depth-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
