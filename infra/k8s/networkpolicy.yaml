# In: the studio/API port only. Out: DNS and HTTPS (webhooks, optional Bedrock brief writer, S3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: depth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: server
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8000
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
        - {port: 443, protocol: TCP}
