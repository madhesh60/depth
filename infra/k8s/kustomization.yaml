# DEPTH on Kubernetes:  kubectl apply -k infra/k8s   (docs/containers.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: depth
labels:
  - pairs:
      app.kubernetes.io/name: depth
      app.kubernetes.io/part-of: depth
    includeSelectors: true
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
images:
  - name: depth
    newName: ghcr.io/madhesh60/depth
    newTag: latest
