<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>DEPTH — architecture: OpenCV 5 agent on AWS Graviton + COOL</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e8fac"/>
    </marker>
    <style>
      .t { font-size: 13px; fill: #16222d; }
      .s { font-size: 11px; fill: #4c5b69; }
      .xs { font-size: 10px; fill: #6a7885; }
      .h { font-size: 12px; font-weight: 700; letter-spacing: .06em; fill: #0b5f73; }
      .b { font-weight: 700; }
      .mono { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace; }
      .stage { fill: #ffffff; stroke: #0e8fac; stroke-width: 1.5; rx: 8; }
      .box { fill: #ffffff; stroke: #9fb0bf; stroke-width: 1.2; rx: 8; }
      .aws { fill: #fff8ec; stroke: #d98e1f; stroke-width: 1.3; stroke-dasharray: 6 4; rx: 8; }
      .opt { fill: #f7f3ff; stroke: #8a73d9; stroke-width: 1.3; stroke-dasharray: 3 3; rx: 8; }
      .flow { stroke: #5b6b7a; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
      .cv { stroke: #0e8fac; stroke-width: 2; fill: none; marker-end: url(#arc); }
      .dash { stroke: #b07a2a; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#ar); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="780" fill="#f4f7fa"/>
  <text x="28" y="38" font-size="22" font-weight="800" fill="#0b2230">DEPTH <tspan font-weight="400" fill="#4c5b69">— side-scan sonar → a human-approved cleanup plan</tspan></text>
  <text x="28" y="60" class="s">Torch-free OpenCV 5 agent on CPU · built for AWS Graviton + COOL · every threshold from <tspan class="mono">models/&lt;MODEL&gt;/calibration.json</tspan></text>

  <!-- users -->
  <rect x="28" y="96" width="170" height="92" class="box"/>
  <text x="44" y="120" class="t b">Crew · analyst · judge</text>
  <text x="44" y="140" class="s">browser studio:</text>
  <text x="44" y="156" class="s">Analyze · Survey · Study · Audit</text>
  <text x="44" y="174" class="xs">3D twin · map · reports</text>

  <rect x="28" y="214" width="170" height="70" class="box"/>
  <text x="44" y="238" class="t b">Sonar frames</text>
  <text x="44" y="256" class="s">PINGMapper sonograms,</text>
  <text x="44" y="272" class="s">uploads, 8 shipped samples</text>

  <!-- CloudFront -->
  <rect x="236" y="96" width="130" height="92" class="aws"/>
  <text x="252" y="120" class="t b">CloudFront</text>
  <text x="252" y="140" class="s">HTTPS edge</text>
  <text x="252" y="156" class="s">origin: EC2 :8000</text>
  <text x="252" y="174" class="xs">(origin-facing IPs only)</text>
  <path d="M198,142 L234,142" class="flow"/>
  <path d="M198,250 L234,250 L234,190" class="flow"/>

  <!-- EC2 COOL box -->
  <rect x="400" y="84" width="852" height="450" rx="12" fill="#eaf6f9" stroke="#0e8fac" stroke-width="1.6"/>
  <text x="418" y="108" class="h">EC2 c8g · GRAVITON4 · COOL AMI — OpenCV 5 under /opt/cool (cv2.__file__ proves it)</text>
  <text x="418" y="126" class="xs">systemd depth.service · FastAPI + background job queue · limits · per-stage metrics · provenance stamp on every result</text>
  <path d="M366,142 L398,142" class="flow"/>

  <!-- five stages -->
  <g>
    <rect x="418" y="146" width="152" height="140" class="stage"/>
    <text x="432" y="170" class="h">1 · CANONICALISE</text>
    <text x="432" y="190" class="s">palette → luminance</text>
    <text x="432" y="206" class="s">orientation by source rule</text>
    <text x="432" y="222" class="s b">bottom track → altitude</text>
    <text x="432" y="238" class="s">slant → ground (remap)</text>
    <text x="432" y="254" class="s">water-column mask</text>
    <text x="432" y="276" class="xs mono">canonical.py</text>

    <rect x="584" y="146" width="152" height="140" class="stage"/>
    <text x="598" y="170" class="h">2 · SEE</text>
    <text x="598" y="190" class="s b">YOLO11 ONNX · cv2.dnn</text>
    <text x="598" y="206" class="s">letterbox · class-aware NMS</text>
    <text x="598" y="222" class="s">floor from calibration</text>
    <text x="598" y="238" class="s">no torch at runtime</text>
    <text x="598" y="276" class="xs mono">detection/infer.py</text>

    <rect x="750" y="146" width="152" height="140" class="stage"/>
    <text x="764" y="170" class="h">3 · PROVE</text>
    <text x="764" y="190" class="s">thin-line acoustic shadow</text>
    <text x="764" y="206" class="s">relative height h/H</text>
    <text x="764" y="222" class="s">water-column check</text>
    <text x="764" y="238" class="s">re-look (value of info.)</text>
    <text x="764" y="254" class="s">evidence — never a gate</text>
    <text x="764" y="276" class="xs mono">tools.py · shadow.py</text>

    <rect x="916" y="146" width="152" height="140" class="stage"/>
    <text x="930" y="170" class="h">4 · DECIDE</text>
    <text x="930" y="190" class="s b">guaranteed tiers</text>
    <text x="930" y="206" class="s">Clopper–Pearson / LTT</text>
    <text x="930" y="222" class="s">≥ 65% of pots reach a</text>
    <text x="930" y="238" class="s">human (held on test: 86%)</text>
    <text x="930" y="254" class="s">calibrated P(pot) queue</text>
    <text x="930" y="276" class="xs mono">policy.py · agent.py</text>

    <rect x="1082" y="146" width="152" height="140" class="stage"/>
    <text x="1096" y="170" class="h">5 · ACT</text>
    <text x="1096" y="190" class="s">per-ping ground geotag</text>
    <text x="1096" y="206" class="s">stitch · repeat-sighting</text>
    <text x="1096" y="222" class="s">routes · time budgets</text>
    <text x="1096" y="238" class="s b">opposite-side re-survey</text>
    <text x="1096" y="254" class="s">exports · brief · trace</text>
    <text x="1096" y="276" class="xs mono">mission.py · resurvey</text>

    <path d="M570,216 L582,216" class="cv"/>
    <path d="M736,216 L748,216" class="cv"/>
    <path d="M902,216 L914,216" class="cv"/>
    <path d="M1068,216 L1080,216" class="cv"/>
  </g>
  <!-- OpenCV influence arrows -->
  <path d="M494,286 C494,340 1150,340 1150,290" stroke="#0e8fac" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arc)"/>
  <text x="600" y="352" class="xs" fill="#0b5f73">Stage-1 geometry moves every pin — without it 193 / 264 leave their own error circle (STUDY-12)</text>

  <!-- human loop + outputs inside EC2 -->
  <rect x="418" y="360" width="400" height="156" class="box"/>
  <text x="434" y="384" class="h">HUMAN IN THE LOOP · nothing auto-dispatched</text>
  <text x="434" y="406" class="s">✓ / ✕ / ＋ missed pot → fine-tune set + hard negatives</text>
  <text x="434" y="424" class="s">timed study (manual vs cards) → effort curve, break-even card time</text>
  <text x="434" y="442" class="s">blinded false-alarm audit with catch trials → audited precision</text>
  <text x="434" y="460" class="s">REVIEW queue ordered by P(pot) · inspection route · human gate</text>
  <text x="434" y="490" class="xs mono">feedback.py · study.py · effort.py · fp_audit.py</text>

  <rect x="834" y="360" width="400" height="156" class="box"/>
  <text x="850" y="384" class="h">WHAT LEAVES THE MACHINE</text>
  <text x="850" y="406" class="s">GeoJSON · GPX · KML · CSV · JSON (provenance-stamped)</text>
  <text x="850" y="424" class="s">agent decision log (JSONL, never public)</text>
  <text x="850" y="442" class="s">public share: protected-site (wreck) positions generalised</text>
  <text x="850" y="460" class="s">mission brief — every number traced to the survey</text>
  <text x="850" y="478" class="s">3D digital twin (three.js) · synthetic GPS always labelled</text>
  <text x="850" y="500" class="xs mono">dashboard/app.py · webui/</text>
  <path d="M1200,286 L1200,358" class="flow"/>
  <path d="M940,286 C940,330 560,318 560,358" class="flow"/>

  <!-- AWS services row -->
  <rect x="400" y="568" width="160" height="92" class="aws"/>
  <text x="416" y="592" class="t b">S3</text>
  <text x="416" y="610" class="s">model (sha256-checked)</text>
  <text x="416" y="626" class="s">uploads (7-day lifecycle)</text>
  <text x="416" y="642" class="s">results · benchmarks</text>

  <rect x="574" y="568" width="160" height="92" class="aws"/>
  <text x="590" y="592" class="t b">CloudWatch</text>
  <text x="590" y="610" class="s">status alarm → recover</text>
  <text x="590" y="626" class="s">+ email · JSON frame logs</text>

  <rect x="748" y="568" width="160" height="92" class="aws"/>
  <text x="764" y="592" class="t b">Budgets · SSM · IAM</text>
  <text x="764" y="610" class="s">50% / 90% cost alerts</text>
  <text x="764" y="626" class="s">no SSH port (Session Mgr)</text>
  <text x="764" y="642" class="s">role scoped to the bucket</text>

  <rect x="922" y="568" width="160" height="92" class="opt"/>
  <text x="938" y="592" class="t b">Amazon Bedrock</text>
  <text x="938" y="610" class="s">optional: Claude writes</text>
  <text x="938" y="626" class="s">the brief — never decides;</text>
  <text x="938" y="642" class="s">ungrounded → template</text>

  <rect x="1096" y="568" width="156" height="92" class="box"/>
  <text x="1112" y="592" class="t b">COOL benchmark</text>
  <text x="1112" y="610" class="s">x86 stock · Graviton</text>
  <text x="1112" y="626" class="s">stock · Graviton COOL</text>
  <text x="1112" y="642" class="s">same code, frames, model</text>

  <path d="M480,534 L480,566" class="dash"/>
  <path d="M654,534 L654,566" class="dash"/>
  <path d="M828,534 L828,566" class="dash"/>
  <path d="M1002,534 L1002,566" class="dash"/>
  <path d="M1174,534 L1174,566" class="dash"/>

  <!-- offline training -->
  <rect x="28" y="330" width="340" height="310" class="box"/>
  <text x="44" y="354" class="h">OFFLINE — DATA · TRAINING · CALIBRATION</text>
  <text x="44" y="378" class="s">7 raw archives → v1 (4 cls) → <tspan class="b">v2b</tspan>: sonar-only,</text>
  <text x="44" y="394" class="s">one copy per Roboflow frame, held-out recordings</text>
  <text x="44" y="418" class="s">build_tiles: full + 2×2 tiles, sonar-aware paste</text>
  <text x="44" y="442" class="s">train.py on Kaggle T4 → ONNX</text>
  <text x="44" y="466" class="s">onboard_model: verify in cv2.dnn + gate</text>
  <text x="44" y="490" class="s">calibrate on validation recordings,</text>
  <text x="44" y="506" class="s">verify ONCE on unseen test (unique frames)</text>
  <text x="44" y="530" class="s b">→ models/&lt;MODEL&gt;/calibration.json</text>
  <text x="44" y="554" class="s">evaluate · failure gallery · STUDY-01…12</text>
  <text x="44" y="578" class="s">(negative results published)</text>
  <text x="44" y="626" class="xs mono">DATASET/scripts · detection/ · agentic/calibrate.py</text>
  <path d="M368,500 C388,500 388,440 416,440" class="flow"/>
  <text x="372" y="470" class="xs">model +</text>
  <text x="372" y="482" class="xs">tiers</text>

  <!-- legend -->
  <rect x="28" y="692" width="1224" height="64" rx="8" fill="#ffffff" stroke="#d3dde6"/>
  <rect x="46" y="710" width="26" height="16" class="stage"/>
  <text x="80" y="723" class="s">OpenCV 5 stage (runs end to end, tested)</text>
  <rect x="330" y="710" width="26" height="16" class="box"/>
  <text x="364" y="723" class="s">built and tested locally</text>
  <rect x="540" y="710" width="26" height="16" class="aws"/>
  <text x="574" y="723" class="s">AWS — scripted in infra/ (dry-run checked), deployed on the AWS day</text>
  <rect x="990" y="710" width="26" height="16" class="opt"/>
  <text x="1024" y="723" class="s">optional, off by default</text>
  <text x="46" y="746" class="xs">Scaling (described, not built): survey jobs → SQS → Auto Scaling group of the same COOL AMI on Spot → S3. Every number here is from docs/ (calibration_exp001.md, causal_trace.md).</text>
</svg>
