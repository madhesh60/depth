<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>DEPTH — architecture as built (2026-10-21): the core loop and the OpenCV 5 stages, on AWS Graviton (COOL planned)</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e8fac"/>
    </marker>
    <style>
      .t { font-size: 13px; fill: #16222d; }
      .s { font-size: 11px; fill: #4c5b69; }
      .xs { font-size: 10px; fill: #6a7885; }
      .h { font-size: 12px; font-weight: 700; letter-spacing: .06em; fill: #0b5f73; }
      .ch { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; fill: #0b5f73; }
      .note { font-size: 10px; fill: #0b5f73; }
      .warn { font-size: 10px; fill: #a8650f; }
      .b { font-weight: 700; }
      .lk { font-weight: 700; fill: #0b5f73; }
      .mono { font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace; }
      .stage { fill: #ffffff; stroke: #0e8fac; stroke-width: 1.5; }
      .loop { fill: #ffffff; stroke: #0b5f73; stroke-width: 2; }
      .chip { fill: #e3f3f7; stroke: #0e8fac; stroke-width: 1.2; }
      .box { fill: #ffffff; stroke: #9fb0bf; stroke-width: 1.2; }
      .aws { fill: #fff8ec; stroke: #d98e1f; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .opt { fill: #f7f3ff; stroke: #8a73d9; stroke-width: 1.3; stroke-dasharray: 3 3; }
      .flow { stroke: #5b6b7a; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
      .cv { stroke: #0e8fac; stroke-width: 2; fill: none; marker-end: url(#arc); }
      .dash { stroke: #b07a2a; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#ar); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="840" fill="#f4f7fa"/>
  <text x="28" y="38" font-size="22" font-weight="800" fill="#0b2230">DEPTH <tspan font-weight="400" fill="#4c5b69">— side-scan sonar → a human-approved cleanup plan</tspan></text>
  <text x="28" y="60" class="s">Torch-free OpenCV 5 agent on CPU · designed for AWS Graviton + COOL · every class and threshold from <tspan class="mono">models/&lt;MODEL&gt;/calibration.json</tspan> · as built, 2026-10-21</text>

  <!-- people and input -->
  <rect x="28" y="88" width="182" height="104" rx="8" class="box"/>
  <text x="44" y="112" class="t b">Crew · analyst · judge</text>
  <text x="44" y="132" class="s">browser studio:</text>
  <text x="44" y="148" class="s">Analyze · Survey · Study · Audit</text>
  <text x="44" y="164" class="s">Agent tab: how it decided</text>
  <text x="44" y="180" class="xs">approvals inbox · map · 3D twin</text>

  <rect x="28" y="208" width="182" height="104" rx="8" class="box"/>
  <text x="44" y="232" class="t b">Sonar input</text>
  <text x="44" y="252" class="s">sonogram images: uploads,</text>
  <text x="44" y="268" class="s">8 held-out test samples</text>
  <text x="44" y="286" class="s b">raw Humminbird recording</text>
  <text x="44" y="302" class="xs">per-ping GPS · heading · depth</text>

  <!-- CloudFront -->
  <rect x="238" y="88" width="132" height="104" rx="8" class="aws"/>
  <text x="252" y="112" class="t b">CloudFront</text>
  <text x="252" y="132" class="s">HTTPS edge</text>
  <text x="252" y="148" class="s">X-Origin-Verify</text>
  <text x="252" y="166" class="warn">pending AWS account</text>
  <text x="252" y="180" class="warn">verification</text>
  <path d="M210,140 L236,140" class="flow"/>
  <path d="M210,262 L304,262 L304,194" class="flow"/>
  <path d="M370,140 L398,140" class="flow"/>

  <!-- EC2 -->
  <rect x="400" y="80" width="852" height="530" rx="12" fill="#eaf6f9" stroke="#0e8fac" stroke-width="1.6"/>
  <text x="418" y="104" class="h">EC2 c8g.large · GRAVITON4 · COOL AMI planned — runs stock OpenCV 5 today</text>
  <text x="418" y="121" class="xs">today: rehearsal on stock OpenCV 5 (the COOL subscription is pending) · systemd · FastAPI + job queue · rate limits · provenance stamp on every result</text>

  <!-- the core loop -->
  <rect x="418" y="130" width="816" height="108" rx="10" class="loop"/>
  <text x="432" y="149" class="h">THE CORE LOOP · every survey, on by default · every step logged</text>
  <text x="1132" y="149" class="xs mono">agentic/core.py</text>

  <rect x="426" y="158" width="120" height="52" rx="6" class="chip"/>
  <text x="436" y="175" class="ch">GOAL</text>
  <text x="436" y="190" class="xs">recall · compute ·</text>
  <text x="436" y="203" class="xs">analyst · boat time</text>

  <rect x="562" y="158" width="120" height="52" rx="6" class="chip"/>
  <text x="572" y="175" class="ch">INSPECT</text>
  <text x="572" y="190" class="xs">usable frames?</text>
  <text x="572" y="203" class="xs">bad ones reported</text>

  <rect x="698" y="158" width="120" height="52" rx="6" class="chip"/>
  <text x="708" y="175" class="ch">CHECK PROMISE</text>
  <text x="708" y="190" class="xs">Laplacian · Sobel ·</text>
  <text x="708" y="203" class="xs">histograms → p-values</text>

  <rect x="834" y="158" width="120" height="52" rx="6" class="chip"/>
  <text x="844" y="175" class="ch">CHOOSE LOOK</text>
  <text x="844" y="190" class="xs">standard ≥ 78% or</text>
  <text x="844" y="203" class="xs">look harder ≥ 84%</text>

  <rect x="970" y="158" width="120" height="52" rx="6" class="chip"/>
  <text x="980" y="175" class="ch">PERCEIVE</text>
  <text x="980" y="190" class="xs">every frame (below)</text>
  <text x="980" y="203" class="xs">overrun → re-plan</text>

  <rect x="1106" y="158" width="120" height="52" rx="6" class="chip"/>
  <text x="1116" y="175" class="ch">PLAN · ASK</text>
  <text x="1116" y="190" class="xs">routes · passes ·</text>
  <text x="1116" y="203" class="xs">1 request per action</text>

  <path d="M546,184 L560,184" class="cv"/>
  <path d="M682,184 L696,184" class="cv"/>
  <path d="M818,184 L832,184" class="cv"/>
  <path d="M954,184 L968,184" class="cv"/>
  <path d="M1090,184 L1104,184" class="cv"/>
  <path d="M712,210 L712,221" stroke="#0e8fac" stroke-width="1.3" fill="none" marker-end="url(#arc)"/>
  <text x="706" y="232" class="xs"><tspan class="lk">no →</tspan> withdraw the promise · cheapest look · ask a person for a full review (another sonar: 22 of 22)</text>

  <!-- per-frame stages -->
  <text x="418" y="254" class="note">per frame, on CPU — what PERCEIVE runs:</text>

  <rect x="418" y="262" width="152" height="164" rx="8" class="stage"/>
  <text x="432" y="286" class="h">1 · CANONICALISE</text>
  <text x="432" y="306" class="s">palette → luminance</text>
  <text x="432" y="322" class="s b">bottom track → altitude</text>
  <text x="432" y="338" class="xs mono">cv2.Sobel · cv2.blur</text>
  <text x="432" y="354" class="s">slant → ground (remap)</text>
  <text x="432" y="370" class="s">water-column mask</text>
  <text x="432" y="386" class="s">sounder cross-check</text>
  <text x="432" y="402" class="s">per-ping dropout mask</text>
  <text x="432" y="418" class="xs mono">canonical.py</text>

  <rect x="584" y="262" width="152" height="164" rx="8" class="stage"/>
  <text x="598" y="286" class="h">2 · SEE</text>
  <text x="598" y="306" class="s b">YOLO11 ONNX · cv2.dnn</text>
  <text x="598" y="322" class="s">OpenCV 5 new engine</text>
  <text x="598" y="338" class="s">634/634 same as classic</text>
  <text x="598" y="354" class="s">class-aware NMS</text>
  <text x="598" y="370" class="s">look harder: 2×2 tiles</text>
  <text x="598" y="386" class="s">(4 more passes, merged)</text>
  <text x="598" y="402" class="s">no torch at runtime</text>
  <text x="598" y="418" class="xs mono">infer.py · perception</text>

  <rect x="750" y="262" width="152" height="164" rx="8" class="stage"/>
  <text x="764" y="286" class="h">3 · PROVE</text>
  <text x="764" y="306" class="s">thin-line acoustic shadow</text>
  <text x="764" y="322" class="s">relative height h/H</text>
  <text x="764" y="338" class="s">water-column check</text>
  <text x="764" y="354" class="s">re-look view (display)</text>
  <text x="764" y="378" class="s">evidence for a person,</text>
  <text x="764" y="394" class="s b">never a silent gate</text>
  <text x="764" y="418" class="xs mono">shadow.py · tools.py</text>

  <rect x="916" y="262" width="152" height="164" rx="8" class="stage"/>
  <text x="930" y="286" class="h">4 · DECIDE</text>
  <text x="930" y="306" class="s b">guaranteed tiers</text>
  <text x="930" y="322" class="s">pots reaching a person:</text>
  <text x="930" y="338" class="s">one look ≥ 78%</text>
  <text x="940" y="354" class="xs">held on test: 81.1%</text>
  <text x="930" y="370" class="s">look harder ≥ 84%</text>
  <text x="940" y="386" class="xs">held on test: 86.0%</text>
  <text x="930" y="402" class="s">nothing auto-confirmed</text>
  <text x="930" y="418" class="xs mono">policy · guarantees</text>

  <rect x="1082" y="262" width="152" height="164" rx="8" class="stage"/>
  <text x="1096" y="286" class="h">5 · ACT</text>
  <text x="1096" y="306" class="s">per-ping ground geotag</text>
  <text x="1096" y="322" class="s">stitch · merge repeats</text>
  <text x="1096" y="338" class="s">routes · time budgets</text>
  <text x="1096" y="354" class="s b">opposite-side passes</text>
  <text x="1106" y="370" class="xs">ranked per boat-minute</text>
  <text x="1096" y="386" class="s">exports · mission brief</text>
  <text x="1096" y="402" class="s">demo GPS always labelled</text>
  <text x="1096" y="418" class="xs mono">mission · resurvey</text>

  <path d="M570,344 L582,344" class="cv"/>
  <path d="M736,344 L748,344" class="cv"/>
  <path d="M902,344 L914,344" class="cv"/>
  <path d="M1068,344 L1080,344" class="cv"/>

  <!-- OpenCV output drives where the boat goes -->
  <path d="M494,426 L494,438 L1158,438 L1158,430" stroke="#0e8fac" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arc)"/>
  <text x="508" y="453" class="note">Stage-1 geometry decides where every pin goes — without it 95 of 142 leave their own error circle (STUDY-12)</text>

  <!-- people and outputs -->
  <path d="M1040,426 L1040,466 L640,466 L640,476" class="flow"/>
  <path d="M1200,426 L1200,476" class="flow"/>

  <rect x="418" y="478" width="400" height="118" rx="8" class="box"/>
  <text x="434" y="500" class="h">PEOPLE DECIDE · agents can only ask</text>
  <text x="434" y="520" class="s">a named person approves each action (PIN + lockout when public)</text>
  <text x="434" y="536" class="s">✓ / ✕ / recovered / not found → the agent re-plans</text>
  <text x="434" y="552" class="s">labels → fine-tune set + hard negatives</text>
  <text x="434" y="568" class="s">timed study · blinded false-alarm audit (built; need people)</text>
  <text x="434" y="587" class="xs mono">approvals.py · feedback.py · study.py · fp_audit.py</text>

  <rect x="834" y="478" width="400" height="118" rx="8" class="box"/>
  <text x="850" y="500" class="h">WHAT LEAVES THE MACHINE</text>
  <text x="850" y="520" class="s">GeoJSON · GPX · KML · CSV · JSON, provenance-stamped</text>
  <text x="850" y="536" class="s">decision log never public · protected wrecks generalised</text>
  <text x="850" y="552" class="s">mission brief: every number traced to the survey</text>
  <text x="850" y="568" class="s b">MCP · OGC API – Features · HMAC webhooks · embed</text>
  <text x="850" y="587" class="xs mono">dashboard/ routes · mcp_server · ogc · integrations</text>

  <!-- AWS services -->
  <rect x="400" y="640" width="160" height="96" rx="8" class="aws"/>
  <text x="416" y="664" class="t b">S3</text>
  <text x="416" y="682" class="s">versioned · TLS-only</text>
  <text x="416" y="698" class="s">results 30 d · uploads 7 d</text>
  <text x="416" y="714" class="s">benchmarks · receipts</text>

  <rect x="574" y="640" width="160" height="96" rx="8" class="aws"/>
  <text x="590" y="664" class="t b">CloudWatch · SNS</text>
  <text x="590" y="682" class="s">per-stage latency</text>
  <text x="590" y="698" class="s">dashboard · alarms</text>
  <text x="590" y="714" class="s">auto-recover · email</text>

  <rect x="748" y="640" width="160" height="96" rx="8" class="aws"/>
  <text x="764" y="664" class="t b">Budget · SSM · IAM</text>
  <text x="764" y="682" class="s">$40/month alerts</text>
  <text x="764" y="698" class="s">auto-stop 2026-11-10</text>
  <text x="764" y="714" class="s">no SSH · IMDSv2</text>

  <rect x="922" y="640" width="160" height="96" rx="8" class="opt"/>
  <text x="938" y="664" class="t b">Amazon Bedrock</text>
  <text x="938" y="682" class="s">optional: Claude writes</text>
  <text x="938" y="698" class="s">the brief, never decides</text>
  <text x="938" y="714" class="warn">not deployed on the demo</text>

  <rect x="1096" y="640" width="156" height="96" rx="8" class="aws"/>
  <text x="1112" y="664" class="t b">COOL benchmark</text>
  <text x="1112" y="682" class="s">same code · frames</text>
  <text x="1112" y="698" class="s">stock x86 + Arm: done</text>
  <text x="1112" y="714" class="warn">COOL rows: pending</text>

  <path d="M480,610 L480,638" class="dash"/>
  <path d="M654,610 L654,638" class="dash"/>
  <path d="M828,610 L828,638" class="dash"/>
  <path d="M1002,610 L1002,638" class="dash"/>
  <path d="M1174,610 L1174,638" class="dash"/>

  <!-- offline -->
  <rect x="28" y="332" width="344" height="404" rx="8" class="box"/>
  <text x="44" y="356" class="h">OFFLINE — DATA · TRAINING · CALIBRATION</text>
  <text x="44" y="380" class="s">7 raw archives → v1 (4 classes) → <tspan class="b">v2b</tspan>: sonar-only,</text>
  <text x="44" y="396" class="s">one copy per Roboflow frame, held-out recordings</text>
  <text x="44" y="420" class="s">build_tiles: full frames + 2×2 tiles</text>
  <text x="44" y="436" class="s">train on Kaggle T4, explicit optimizer → ONNX</text>
  <text x="44" y="452" class="s">six clean runs → <tspan class="b">EXP-003</tspan> deployed</text>
  <text x="44" y="468" class="s">crab-pot AP@0.5 0.482 on test (target 0.70: not met)</text>
  <text x="44" y="492" class="s">onboard_model: verify in cv2.dnn</text>
  <text x="44" y="516" class="s">calibrate on validation recordings:</text>
  <text x="44" y="532" class="s">Clopper–Pearson / LTT + block bootstrap</text>
  <text x="44" y="548" class="s">for correlated frames (STUDY-21) · two modes</text>
  <text x="44" y="564" class="s">verify ONCE on unseen test (unique frames)</text>
  <text x="44" y="588" class="s b">→ models/&lt;MODEL&gt;/calibration.json</text>
  <text x="44" y="612" class="s">same code, any detector: EXP-001 ≥ 63%,</text>
  <text x="44" y="628" class="s">EXP-003 ≥ 78% — each verified on unseen data</text>
  <text x="44" y="652" class="s">STUDY-01…22 · negative results published</text>
  <text x="44" y="676" class="s">people's labels → fine-tune set → the next run</text>
  <text x="44" y="724" class="xs mono">DATASET/scripts · detection/ · agentic/</text>
  <path d="M372,584 C392,584 392,344 414,344" class="flow"/>

  <!-- legend -->
  <rect x="28" y="756" width="1224" height="66" rx="8" fill="#ffffff" stroke="#d3dde6"/>
  <rect x="46" y="772" width="26" height="16" rx="4" class="stage"/>
  <text x="80" y="785" class="s">OpenCV 5 stage (runs end to end, tested)</text>
  <rect x="306" y="772" width="26" height="16" rx="4" class="loop"/>
  <text x="340" y="785" class="s">the core loop (on by default)</text>
  <rect x="512" y="772" width="26" height="16" rx="4" class="box"/>
  <text x="546" y="785" class="s">built and tested</text>
  <rect x="656" y="772" width="26" height="16" rx="4" class="aws"/>
  <text x="690" y="785" class="s">AWS: one stack, applied 2026-10-19 — CloudFront and COOL pending</text>
  <rect x="1050" y="772" width="26" height="16" rx="4" class="opt"/>
  <text x="1084" y="785" class="s">optional, off by default</text>
  <text x="46" y="810" class="xs">Numbers (EXP-003, 2026-10-21): docs/calibration_exp003.md · docs/reports/look_harder.md · dependence.md · applicability.md · causal_trace.md. Scaling (described, not built): survey jobs → SQS → Auto Scaling group of the same COOL AMI → S3.</text>
</svg>
