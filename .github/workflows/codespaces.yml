# The judges' click-to-run path, tested the way a codespace runs it (README button -> .devcontainer/):
# the devcontainer's image, its own setup command (postCreateCommand) and start command (postAttachCommand),
# both read from devcontainer.json and run as the codespace's user (vscode), on 2 CPUs and 4 GB (its
# hostRequirements). Then the real studio in
# headless Chromium: boot -> Analyze -> a Survey with the studio's default 20-s compute budget -> the guided
# demo to its last step, with 0 JS errors; and the first-survey time with and without that budget.
# What only a real codespace shows (port forwarding, the browser tab it opens) is a person's check.
name: codespaces

on:
  push:
    branches: [main]
    paths: [".devcontainer/**", "requirements.txt", "src/**", "webui/**", "models/**", "tests/ui_smoke.py",
            ".github/workflows/codespaces.yml"]
  workflow_dispatch:

jobs:
  studio-in-the-devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/devcontainers/python:1-3.10-bookworm
      options: --cpus 2 --memory 4g --shm-size 1g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read the codespace's commands from devcontainer.json
        run: |
          python - >> "$GITHUB_ENV" <<'EOF'
          import json, re
          cfg = json.loads(re.sub(r"(?m)^\s*//.*$", "", open(".devcontainer/devcontainer.json", encoding="utf-8").read()))
          print("POST_CREATE=" + cfg["postCreateCommand"])
          print("POST_ATTACH=" + cfg["postAttachCommand"])
          EOF

      - name: postCreateCommand - the codespace's setup, as its user (vscode)
        run: |
          chown -R vscode:vscode "$GITHUB_WORKSPACE"
          echo "$POST_CREATE"
          time runuser -u vscode -- env PATH="$PATH" HOME=/home/vscode bash -c "$POST_CREATE"

      - name: postAttachCommand - starts the studio, as when the browser attaches
        run: |
          echo "$POST_ATTACH"
          setsid nohup runuser -u vscode -- env PATH="$PATH" HOME=/home/vscode bash -c "$POST_ATTACH" > /tmp/studio.log 2>&1 &
          for i in $(seq 1 150); do
            if curl -sf http://127.0.0.1:8000/api/health | python -c "import json, sys; sys.exit(0 if json.load(sys.stdin).get('model_loaded') else 1)"; then
              echo "::notice title=Studio ready::the codespace setup finished and the studio loaded the model after ~$((2 * i)) s"; break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health | python -c "import json, sys; h = json.load(sys.stdin); print({k: h.get(k) for k in ('model_loaded', 'model', 'opencv', 'warmup_ms', 'ms_per_pass', 'recording')})"

      - name: Headless Chromium for the UI test (the test's tool, not part of the codespace)
        run: |
          apt-get update -qq || true
          apt-get install -y -qq --no-install-recommends chromium > /dev/null
          pip install -q websockets==15.0.1

      - name: The studio, a survey and the guided demo to its last step - 0 JS errors
        run: |
          python tests/ui_smoke.py --url http://127.0.0.1:8000 --full-demo | tee /tmp/ui_smoke.out
          python - <<'EOF'
          import json
          t = open("/tmp/ui_smoke.out", encoding="utf-8").read()
          r = json.loads(t[t.index("{"):t.rindex("}") + 1])
          s, d = r["steps"]["survey"], r["steps"]["demo"]
          print(f"::notice title=Studio in the codespace image (2 CPUs)::survey of the 8 demo frames {s['seconds']} s "
                f"(compute budget {s['compute_budget_s']} s, look {s['mode']}, downgraded at {s['downgraded_at']}); "
                f"guided demo {d['step']} in {d['seconds']} s; {len(r['errors'])} JS errors")
          EOF

      - name: Survey time on 2 CPUs - no compute budget vs the studio's default 20 s
        run: |
          python - <<'EOF'
          import json, time, urllib.request
          for q in ("", "&compute_s=20"):
              t0 = time.time()
              url = "http://127.0.0.1:8000/api/survey?use_samples=1&gps=synthetic&budget_minutes=2&boat_minutes=10" + q
              d = json.load(urllib.request.urlopen(urllib.request.Request(url, method="POST"), timeout=900))
              run = d.get("agent_run") or {}
              print(f"::notice title=Survey of the 8 demo frames on 2 CPUs with compute budget {'20 s' if q else 'none'}::"
                    f"{time.time() - t0:.1f} s wall, look {(run.get('mode') or {}).get('name')}, downgraded at "
                    f"{run.get('downgraded_at')}, {len(d.get('tracked') or [])} hazards")
          EOF

      - name: Studio log
        if: always()
        run: tail -n 60 /tmp/studio.log || true
