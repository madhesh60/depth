# The container path, tested for real on every change to it: build the image (the detector fetched and
# SHA-256 checked), run it locked down (read-only root, no capabilities, non-root) and do real work in it
# (tests/container_smoke.py: readiness, Analyze, a Survey of the raw recording, the provenance commit);
# then deploy infra/k8s to a throwaway Kubernetes cluster (kind) and run the same smoke test through the
# Service. On main, the tested image is published to ghcr.io/madhesh60/depth.
name: container

on:
  push:
    paths: ["Dockerfile", ".dockerignore", "compose.yaml", "requirements.txt", "infra/k8s/**", "src/**",
            "webui/**", "models/**", "tests/container_smoke.py", ".github/workflows/container.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-and-kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build --build-arg GIT_COMMIT=${GITHUB_SHA} -t depth:ci .

      - name: Image facts (size, user, no torch)
        run: |
          docker image ls depth:ci
          docker run --rm depth:ci id
          docker run --rm depth:ci python -c "import importlib.util as u, cv2; assert u.find_spec('torch') is None; print('OpenCV', cv2.__version__, '- torch-free')"

      - name: Run it locked down and do real work (Docker)
        run: |
          docker run -d --name depth -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v depth-data:/data depth:ci
          python3 tests/container_smoke.py --url http://localhost:8000 --commit ${GITHUB_SHA}
          docker logs depth 2>&1 | tail -20
          docker rm -f depth

      - name: Docker Compose file is valid
        run: docker compose config -q

      - name: Create a Kubernetes cluster (kind)
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: depth

      - name: Deploy infra/k8s and do real work through the Service
        run: |
          kind load docker-image depth:ci --name depth
          kubectl kustomize infra/k8s | sed 's#ghcr.io/madhesh60/depth:latest#depth:ci#' | kubectl apply -f -
          kubectl -n depth rollout status deploy/depth --timeout=300s
          kubectl -n depth get pods,svc,pvc -o wide
          kubectl -n depth port-forward svc/depth 8080:80 >/tmp/pf.log 2>&1 &
          sleep 3
          python3 tests/container_smoke.py --url http://localhost:8080 --commit ${GITHUB_SHA}

      - name: Show the pod's events and logs (on failure)
        if: failure()
        run: |
          kubectl -n depth describe pods || true
          kubectl -n depth logs deploy/depth --tail=100 || true

      - name: Publish the tested image (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest ${GITHUB_SHA::7}; do
            docker tag depth:ci ghcr.io/madhesh60/depth:$tag
            docker push ghcr.io/madhesh60/depth:$tag
          done
