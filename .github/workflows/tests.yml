name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the pinned runtime + test dependencies
        run: pip install -r requirements-dev.txt
      - name: Fetch the published model (SHA-256 checked; model tests skip if it is not released yet)
        run: python -m src.detection.fetch_model || echo "::notice::model release not available - model-dependent tests will skip"
      - name: Show the OpenCV build
        run: python -c "import cv2; print('OpenCV', cv2.__version__, cv2.__file__)"
      - name: Test suite
        env:
          DEPTH_LAZY_MODEL: "1"
        run: pytest -q
