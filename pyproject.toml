# Tool configuration only: DEPTH is run from the repository, not installed as a package.
# Dependencies live in requirements.txt (runtime), requirements-dev.txt (tests + lint) and
# requirements-train.txt (Kaggle training).

[tool.ruff]
target-version = "py310"
# The Kaggle notebook is generated from notebooks/make_kaggle_notebook.py; lint the generator instead.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Default rule set (pycodestyle E4/E7/E9 + Pyflakes F) + flake8-bugbear (B).
extend-select = ["B"]
# E731: short local helpers written as lambdas are the project's idiom.
# B008: FastAPI's Query()/Body()/File() defaults are its documented idiom.
# B023: every closure over a loop variable is called inside the iteration that defines it (all 23 sites
#       reviewed 2026-10-21) - the rule guards against closures that outlive the loop, which none do.
# B905: zip() runs over parallel lists that are equal by construction; strict= would add a runtime check.
# (pyupgrade's UP rules are not adopted: they would rewrite every Optional[...] annotation.)
ignore = ["E731", "B008", "B023", "B905"]

[tool.mypy]
# Type-check the agent's decision core (the goal loop, the tiers and their statistics, approvals, the
# applicability and correlated-frames checks, the analyze queue, the public-mode guard, calibration loading).
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
files = ["src/agentic/core.py", "src/agentic/policy.py", "src/agentic/guarantees.py", "src/agentic/approvals.py",
         "src/agentic/applicability.py", "src/agentic/study_dependence.py", "src/dashboard/detector_queue.py",
         "src/dashboard/origin_guard.py", "src/detection/calibration.py"]

[tool.ruff.lint.per-file-ignores]
# Test modules put the repository root on sys.path before importing src.
"tests/*" = ["E402"]
